<script>
/* VIA — motorul de relevanță și datele reale din București, de pe 17 septembrie.
   Pagina rămâne un singur fișier, dar scorurile NU sunt precalculate: se recalculează
   aici, în browser, de fiecare dată când se schimbă profilul sau fereastra de timp. */
(function () {
  var M_scor = (function () {
/**
 * VIA Relevance Score™ — scorul de relevanță, calculat pentru un om anume.
 *
 * Nu e un rating public. Aceeași intrare primește scoruri diferite pentru oameni
 * diferiți, iar scorul vine întotdeauna cu motivul lui în limbaj natural.
 *
 * Șase straturi, fiecare între 0 și 1, combinate cu ponderile din PONDERI:
 *   1. context personal        — se potrivește cu ce a spus că îl interesează
 *   2. preferințe învățate     — ce a plăcut și ce nu, din istoric
 *   3. momentul potrivit       — e liber atunci, are timp să se organizeze
 *   4. valoare și preț         — cât costă față de bugetul lui obișnuit
 *   5. unicitatea experienței  — se întâmplă o dată sau e în fiecare seară
 *   6. reputație și confirmare — câte surse o confirmă, cât de bine știm locul
 *
 * Sub PRAG_MINIM nu se arată nimic: mai bine tăcere decât o notificare slabă.
 */

const PONDERI = {
  context: 0.24,
  invatate: 0.18,
  moment: 0.18,
  pret: 0.16,
  unicitate: 0.14,
  reputatie: 0.10,
};

const PRAG_MINIM = 70;

/** Profilul implicit, cât să putem calcula ceva înainte de onboarding real. */
const PROFIL_IMPLICIT = {
  oras: 'București',
  categorii: ['concert', 'teatru', 'expozitie', 'stand-up', 'festival', 'film'],
  artisti: [],
  locuri: [],
  bugetSeara: 150,
  moneda: 'RON',
  seriLibere: [4, 5, 6],            // joi, vineri, sâmbătă (0 = duminică)
  istoric: [],
};

/** Categorii vecine: dacă urmărește una, cealaltă i se potrivește pe jumătate. */
const RUDE = {
  concert: ['festival', 'muzica-clasica', 'club'],
  festival: ['concert', 'teatru', 'film'],
  'muzica-clasica': ['concert', 'teatru'],
  teatru: ['stand-up', 'muzica-clasica'],
  'stand-up': ['teatru', 'club'],
  expozitie: ['cultura', 'atelier'],
  atelier: ['expozitie', 'cultura'],
  film: ['festival'],
  club: ['concert', 'social'],
  social: ['club'],
};

const ORA = 3600e3;
const ZI = 24 * ORA;

const intre = (x, jos, sus) => Math.max(jos, Math.min(sus, x));

/** Ziua săptămânii în București: 0 = duminică. */
function ziSaptamanii(iso) {
  const nume = new Intl.DateTimeFormat('en-US', { timeZone: 'Europe/Bucharest', weekday: 'short' }).format(new Date(iso));
  return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(nume);
}

function textNormalizat(s) {
  return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

function listaJson(s) {
  if (!s) return [];
  try {
    const v = JSON.parse(s);
    return Array.isArray(v) ? v.map(String) : [];
  } catch {
    return [];
  }
}

/* ---------- stratul 1: context personal ---------- */

function stratContext(intrare, profil) {
  const cat = intrare.categorie || 'eveniment';
  const urmarite = new Set(profil.categorii || []);

  // Un artist urmărit bate orice altă potrivire de categorie.
  const unde = textNormalizat(intrare.titlu + ' ' + (intrare.titlu_alt || '') + ' ' + listaJson(intrare.artisti).join(' '));
  const artist = (profil.artisti || []).find((a) => a && unde.includes(textNormalizat(a)));
  if (artist) return { valoare: 1, fapt: { fel: 'artist', artist } };

  // Un loc urmărit la fel: dacă ai cerut să fii anunțat de la Control Club,
  // ce se întâmplă acolo contează, indiferent de gen.
  const loc = (profil.locuri || []).find((l) => l && intrare.locatie_nume
    && textNormalizat(l) === textNormalizat(intrare.locatie_nume));
  if (loc) return { valoare: 1, fapt: { fel: 'loc', loc: intrare.locatie_nume } };

  if (urmarite.has(cat)) return { valoare: 1, fapt: { fel: 'categorie', categorie: cat } };

  const vecina = (RUDE[cat] || []).find((r) => urmarite.has(r));
  if (vecina) return { valoare: 0.55, fapt: { fel: 'vecina', categorie: cat, vecina } };

  return { valoare: 0.15, fapt: null };
}

/* ---------- stratul 2: preferințe învățate ---------- */

/**
 * Cât de repede are voie VIA să se încreadă în ce a învățat. Cu K = 2, o singură
 * apăsare mută scorul doar o treime din drum, iar după patru-cinci ajunge aproape
 * la capăt. Altfel, un „nu" izolat ar șterge o categorie întreagă.
 */
const INCREDERE_K = 2;

function stratInvatate(intrare, profil) {
  const istoric = profil.istoric || [];
  if (!istoric.length) return { valoare: 0.5, fapt: null, incert: true };

  const acelasiLoc = (h) => h.locatie && intrare.locatie_nume
    && textNormalizat(h.locatie) === textNormalizat(intrare.locatie_nume);
  const aceeasiCategorie = (h) => h.categorie && h.categorie === intrare.categorie;

  const potriviri = istoric.filter((h) => aceeasiCategorie(h) || acelasiLoc(h));
  if (!potriviri.length) return { valoare: 0.5, fapt: null, incert: true };

  // verdict: 1 = i-a plăcut, -1 = nu. Media stă în [-1, 1].
  const media = potriviri.reduce((s, h) => s + (Number(h.verdict) || 0), 0) / potriviri.length;
  const n = potriviri.length;
  const incredere = n / (n + INCREDERE_K);

  const plus = potriviri.filter((h) => Number(h.verdict) > 0).length;
  const dinLoc = potriviri.filter(acelasiLoc).length;

  return {
    valoare: intre(0.5 + (media / 2) * incredere, 0.05, 1),
    incert: n < 2,
    fapt: {
      fel: 'istoric',
      din: n,
      plus,
      // Dacă tot ce știm vine de la locul ăsta, spunem locul, nu genul.
      locatie: dinLoc === n ? intrare.locatie_nume : null,
      categorie: intrare.categorie,
    },
  };
}

/* ---------- stratul 3: momentul potrivit ---------- */

function stratMoment(intrare, profil, acum, orizont) {
  const start = intrare.start ? Date.parse(intrare.start) : null;
  const sfarsit = intrare.sfarsit ? Date.parse(intrare.sfarsit) : start;
  if (!start) return { valoare: 0.5, fapt: null, incert: true };

  const libere = new Set(profil.seriLibere || []);
  const continuu = sfarsit && sfarsit - start > 36 * ORA;

  // La ceva care ține mai multe zile e destul ca una din serile libere să cadă în interval.
  // Căutăm numai până la orizontul întrebării: dacă omul întreabă „ce fac diseară",
  // o joi liberă de săptămâna viitoare nu e un motiv.
  let ziLibera = 0.3;
  let ziuaBuna = null;

  // Un local e deschis în mai multe seri: contează dacă vreuna se potrivește cu
  // ale lui, nu seara pe care am ales-o noi când am pregătit datele.
  if (intrare.tip === 'loc' && Array.isArray(intrare.serileDeschise)) {
    const buna = intrare.serileDeschise.find((z) => libere.has(z));
    if (buna !== undefined) { ziLibera = 1; ziuaBuna = buna; }
  } else if (continuu) {
    const pana = Math.min(sfarsit, orizont ?? sfarsit);
    for (let t = Math.max(start, acum); t <= pana; t += ZI) {
      const z = ziSaptamanii(new Date(t).toISOString());
      if (libere.has(z)) { ziLibera = 1; ziuaBuna = z; break; }
    }
  } else if (libere.has(ziSaptamanii(intrare.start))) {
    ziLibera = 1;
    ziuaBuna = ziSaptamanii(intrare.start);
  }

  // „Seara" doar dacă e chiar seara: un eveniment de la 16:00 nu e o seară liberă.
  const oraLocala = Number(new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Bucharest', hour: '2-digit', hour12: false,
  }).format(new Date(start)));

  const ore = (start - acum) / ORA;
  let proximitate;
  if (ore < 0) proximitate = continuu ? 0.9 : 0.1;      // a început deja
  else if (ore < 3) proximitate = 0.35;                 // prea târziu ca să se organizeze
  else if (ore < 24 * 7) proximitate = 1;
  else if (ore < 24 * 30) proximitate = 0.7;
  else proximitate = 0.45;

  // Ce se închide în câteva zile devine urgent, oricât de departe ar fi început.
  const zileRamase = sfarsit ? (sfarsit - acum) / ZI : null;
  const seIncheie = continuu && zileRamase !== null && zileRamase <= 5 && zileRamase > 0;
  if (seIncheie) proximitate = 1;

  return {
    valoare: intre(ziLibera * 0.45 + proximitate * 0.55, 0, 1),
    fapt: {
      fel: 'moment', ziuaBuna, ore, continuu, seara: oraLocala >= 17,
      zileRamase: zileRamase === null ? null : Math.ceil(zileRamase),
      seIncheie,
    },
  };
}

/* ---------- stratul 4: valoare și preț ---------- */

function stratPret(intrare, profil) {
  const buget = Number(profil.bugetSeara) || 150;
  const pret = intrare.pret_min === null || intrare.pret_min === undefined ? null : Number(intrare.pret_min);

  if (pret === null) return { valoare: 0.55, fapt: null, incert: true };
  if (pret === 0) return { valoare: 1, fapt: { fel: 'gratuit' } };

  const raport = pret / buget;
  let valoare;
  if (raport <= 0.4) valoare = 1;
  else if (raport <= 0.7) valoare = 0.9;
  else if (raport <= 1) valoare = 0.78;
  else if (raport <= 1.5) valoare = 0.45;
  else if (raport <= 2.5) valoare = 0.2;
  else valoare = 0.08;

  return { valoare, fapt: { fel: 'pret', pret, buget, raport, moneda: intrare.moneda || profil.moneda } };
}

/* ---------- stratul 5: unicitatea experienței ---------- */

function stratUnicitate(intrare, profil) {
  // Ce am scris noi în baza proprie e, prin definiție, ce nu găsești în altă parte.
  if (intrare.manuala) return { valoare: 0.9, fapt: { fel: 'proprie' } };

  // Un local nu se „epuizează" ca un concert: ce contează e dacă ai fost deja.
  if (intrare.tip === 'loc') {
    const stiut = (profil.istoric || []).some((h) => h.locatie
      && textNormalizat(h.locatie) === textNormalizat(intrare.locatie_nume));
    return stiut
      ? { valoare: 0.35, fapt: { fel: 'locStiut' } }
      : { valoare: 0.72, fapt: { fel: 'locNou' } };
  }

  if (intrare.tip === 'film') {
    const p = Number(intrare.proiectii) || 0;
    const valoare = p >= 150 ? 0.16 : p >= 60 ? 0.28 : p >= 20 ? 0.42 : 0.6;
    return { valoare, fapt: { fel: 'film', proiectii: p, cinematografe: Number(intrare.cinematografe) || 0 } };
  }

  const sfarsit = intrare.sfarsit ? Date.parse(intrare.sfarsit) : null;
  const start = intrare.start ? Date.parse(intrare.start) : null;
  if (sfarsit && start && sfarsit - start > 36 * ORA) {
    return { valoare: 0.62, fapt: { fel: 'continuu' } };
  }

  const reprezentatii = Number(intrare.reprezentatii) || 1;
  const valoare = reprezentatii <= 1 ? 0.92 : reprezentatii <= 3 ? 0.7 : reprezentatii <= 8 ? 0.5 : 0.32;
  return { valoare, fapt: { fel: 'reprezentatii', reprezentatii } };
}

/* ---------- stratul 6: reputație și confirmare ---------- */

function stratReputatie(intrare) {
  // Despre un local din catalog știm adresa și programul, atât — nicio notă,
  // nicio recenzie. Nu e o confirmare, e o listare; scorul trebuie s-o spună.
  if (intrare.tip === 'loc') return { valoare: 0.5, fapt: null };

  const surse = Number(intrare.surse) || 0;
  if (surse > 1) return { valoare: 1, fapt: { fel: 'surse', surse } };
  if (intrare.locatie_adresa && intrare.locatie_program) return { valoare: 0.72, fapt: { fel: 'locCunoscut' } };
  if (intrare.locatie_nume) return { valoare: 0.55, fapt: null };
  return { valoare: 0.3, fapt: null };
}

/* ---------- explicația ---------- */

const ZILE = ['duminică', 'luni', 'marți', 'miercuri', 'joi', 'vineri', 'sâmbătă'];

const NUME_CATEGORII = {
  concert: 'concertele', teatru: 'teatrul', 'stand-up': 'stand-up-ul', expozitie: 'expozițiile',
  festival: 'festivalurile', film: 'filmele', atelier: 'atelierele', club: 'ieșirile în club',
  'muzica-clasica': 'muzica clasică', social: 'evenimentele sociale', cultura: 'evenimentele culturale',
  food: 'restaurantele', cafenea: 'cafenelele',
};

const numeCat = (c) => NUME_CATEGORII[c] || 'evenimentele de genul ăsta';

/** O propoziție pentru fiecare strat care are ceva concret de spus. */
function propozitie(cheie, fapt, intrare) {
  if (!fapt) return null;
  switch (fapt.fel) {
    case 'artist':
      return fapt.artist + ' e pe lista artiștilor pe care îi urmărești.';
    case 'loc':
      return 'Urmărești ce se întâmplă la ' + fapt.loc + '.';
    case 'categorie':
      return 'Ai spus că te interesează ' + numeCat(fapt.categorie) + '.';
    case 'vecina':
      return 'E aproape de ' + numeCat(fapt.vecina) + ', pe care le urmărești.';
    case 'istoric': {
      const unde = fapt.locatie ? 'la ' + fapt.locatie : 'de genul ăsta';
      if (fapt.plus === 0) {
        return fapt.din === 1
          ? 'Ce ai încercat ' + unde + ' nu ți-a plăcut.'
          : 'Nimic din ce ai încercat ' + unde + ' nu ți-a plăcut până acum.';
      }
      if (fapt.plus === fapt.din) {
        return fapt.din === 1
          ? 'Ultima ieșire ' + unde + ' ți-a plăcut.'
          : 'Toate cele ' + fapt.din + ' ieșiri ' + unde + ' ți-au plăcut.';
      }
      return fapt.plus + ' din ' + fapt.din + ' ieșiri ' + unde + ' ți-au plăcut.';
    }
    case 'moment': {
      const bucati = [];
      if (fapt.seIncheie) {
        bucati.push(fapt.zileRamase <= 1 ? 'Se închide mâine.' : 'Se închide în ' + fapt.zileRamase + ' zile.');
      }
      if (fapt.ziuaBuna !== null && fapt.ziuaBuna !== undefined) {
        bucati.push(fapt.continuu
          ? 'Prinzi o ' + ZILE[fapt.ziuaBuna] + ' liberă până se termină.'
          : 'E ' + ZILE[fapt.ziuaBuna] + (fapt.seara ? ' seara' : '') + ', când de obicei ești liber.');
      }
      return bucati.join(' ') || null;
    }
    case 'gratuit':
      return 'Intrarea e liberă.';
    case 'pret': {
      const m = fapt.moneda === 'RON' ? 'lei' : fapt.moneda || 'lei';
      if (fapt.raport <= 0.7) {
        return 'Costă ' + Math.round(fapt.pret) + ' ' + m + ', bine sub bugetul tău obișnuit de ' + fapt.buget + '.';
      }
      if (fapt.raport <= 1) return 'Costă ' + Math.round(fapt.pret) + ' ' + m + ', cât ai de obicei pentru o seară.';
      return 'Costă ' + Math.round(fapt.pret) + ' ' + m + ', peste bugetul tău obișnuit de ' + fapt.buget + '.';
    }
    case 'locNou':
      return 'N-ai fost încă acolo, după câte știu eu.';
    case 'locStiut':
      return 'Ai mai fost acolo.';
    case 'proprie':
      return 'Intrarea asta e din baza noastră, nu de pe un site — de aici știm ce nu se anunță public.';
    case 'film':
      return fapt.proiectii >= 60
        ? 'Rulează în ' + fapt.cinematografe + ' cinematografe, deci îl prinzi și altă zi.'
        : 'Are puține proiecții, nu stă mult pe ecrane.';
    case 'continuu':
      return 'Ține mai multe zile, îți alegi tu momentul.';
    case 'reprezentatii':
      return fapt.reprezentatii <= 1
        ? 'E o singură reprezentație, nu se repetă.'
        : 'Are ' + fapt.reprezentatii + ' reprezentații în perioada asta.';
    case 'surse':
      return 'Confirmat de ' + fapt.surse + ' surse independente.';
    case 'locCunoscut':
      return 'Știm locul: adresă și program verificate.';
    default:
      return null;
  }
}

/** Insigna scurtă de pe card: faptul cel mai vandabil, într-o expresie. */
function insigna(straturi, intrare) {
  const f = Object.fromEntries(Object.entries(straturi).map(([k, v]) => [k, v.fapt]));

  if (f.moment?.seIncheie) {
    return { text: f.moment.zileRamase <= 1 ? 'Ultima zi' : 'Ultimele ' + f.moment.zileRamase + ' zile', bun: false };
  }
  if (f.unicitate?.fel === 'proprie') return { text: 'Din baza noastră', bun: true };
  if (f.context?.fel === 'artist') return { text: 'Artist pe care îl urmărești', bun: true };
  if (f.context?.fel === 'loc') return { text: 'La un loc pe care îl urmărești', bun: true };
  if (f.pret?.fel === 'gratuit') return { text: 'Intrare liberă', bun: true };
  if (f.pret && f.pret.raport <= 0.7) {
    return { text: Math.round((1 - f.pret.raport) * 100) + '% sub bugetul tău', bun: true };
  }
  if (f.reputatie?.fel === 'surse') return { text: 'Confirmat de ' + f.reputatie.surse + ' surse', bun: true };
  if (f.unicitate?.fel === 'reprezentatii' && f.unicitate.reprezentatii <= 1) {
    return { text: 'O singură reprezentație', bun: false };
  }
  if (f.unicitate?.fel === 'continuu') return { text: 'Îți alegi tu ziua', bun: false };
  if (f.unicitate?.fel === 'locNou') return { text: 'Loc nou pentru tine', bun: true };
  if (intrare.tip === 'film' && f.unicitate?.cinematografe) {
    return { text: 'În ' + f.unicitate.cinematografe + ' cinematografe', bun: false };
  }
  return { text: 'Potrivit cu profilul tău', bun: false };
}
