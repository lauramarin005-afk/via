<style>
/* ============================================================
   VIA — prototip clickable
   Trei persona-teme complete. Fiecare culoare vine din tokens.
   ============================================================ */

:root {
  --font-ui: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 22px; --sp-6: 30px; --sp-7: 42px; --sp-8: 60px;

  --rail: 248px;
  --panel: 330px;

  /* ============================================================
     Paleta oficială VIA (brand book):
       Albastru VIA  #3A6BFF   Negru profund #0D0D0F
       Gri           #6B6B6B   Alb           #FFFFFF
     Albastrul e singurul accent. Punctul VIA e mereu albastru.
     ============================================================ */

  /* ---- VIA DARK — varianta principală ---- */
  --bg:        #0D0D0F;
  --bg-rail:   #0A0A0C;
  --surface:   #141417;
  --surface-2: #1B1B1F;
  --surface-3: #26262B;
  --line:      rgba(255, 255, 255, 0.08);
  --line-2:    rgba(255, 255, 255, 0.16);
  --text:      #FFFFFF;
  --text-2:    #A3A3AB;
  --text-3:    #6B6B6B;
  --accent:    #3A6BFF;
  --accent-2:  #7C9CFF;
  --accent-ink:#FFFFFF;
  --accent-soft: rgba(58, 107, 255, 0.14);
  --gold:      #3A6BFF;
  --good:      #34D399;
  --warn:      #FBBF24;
  --crit:      #F87171;
  --orb-core:  #E8EEFF;
  --orb-mid:   #3A6BFF;
  --orb-glow:  rgba(58, 107, 255, 0.55);
  --shadow:    0 24px 50px -28px rgba(0, 0, 0, 0.95);
  --shadow-sm: 0 8px 22px -14px rgba(0, 0, 0, 0.85);
  --art-veil:  rgba(13, 13, 15, 0.6);
  --scrim:     rgba(8, 8, 10, 0.8);
  --mark:      #FFFFFF;
}

/* ---- VIA LIGHT — varianta light din brand book ---- */
:root[data-persona="lumina"] {
  --bg:        #FFFFFF;
  --bg-rail:   #F6F7F9;
  --surface:   #FFFFFF;
  --surface-2: #F6F7F9;
  --surface-3: #ECEEF2;
  --line:      rgba(13, 13, 15, 0.09);
  --line-2:    rgba(13, 13, 15, 0.18);
  --text:      #0D0D0F;
  --text-2:    #55555C;
  --text-3:    #6B6B6B;
  --accent:    #3A6BFF;
  --accent-2:  #2B52D6;
  --accent-ink:#FFFFFF;
  --accent-soft: rgba(58, 107, 255, 0.09);
  --gold:      #3A6BFF;
  --good:      #12855F;
  --warn:      #B47100;
  --crit:      #C6483F;
  --orb-core:  #EDF2FF;
  --orb-mid:   #3A6BFF;
  --orb-glow:  rgba(58, 107, 255, 0.38);
  --shadow:    0 22px 46px -30px rgba(13, 13, 15, 0.28);
  --shadow-sm: 0 8px 20px -14px rgba(13, 13, 15, 0.2);
  --art-veil:  rgba(255, 255, 255, 0.2);
  --scrim:     rgba(255, 255, 255, 0.88);
  --mark:      #0D0D0F;
}

/* ---- 10-17 ANI — explorare, ancorată tot pe albastrul VIA ---- */
:root[data-persona="tanar"] {
  --bg:        #0A0917;
  --bg-rail:   #0E0C20;
  --surface:   #15132C;
  --surface-2: #1D1A3C;
  --surface-3: #272252;
  --line:      rgba(200, 208, 255, 0.12);
  --line-2:    rgba(200, 208, 255, 0.22);
  --text:      #F2F3FF;
  --text-2:    #A6A8C8;
  --text-3:    #7B7D9C;
  --accent:    #3A6BFF;
  --accent-2:  #A855F7;
  --accent-ink:#FFFFFF;
  --accent-soft: rgba(58, 107, 255, 0.2);
  --gold:      #A855F7;
  --good:      #34D399;
  --warn:      #FBBF24;
  --crit:      #FB7185;
  --orb-core:  #E9EDFF;
  --orb-mid:   #3A6BFF;
  --orb-glow:  rgba(88, 110, 255, 0.6);
  --shadow:    0 24px 50px -28px rgba(5, 4, 20, 0.92);
  --shadow-sm: 0 8px 22px -14px rgba(5, 4, 20, 0.85);
  --art-veil:  rgba(10, 9, 23, 0.55);
  --scrim:     rgba(6, 5, 16, 0.82);
  --mark:      #FFFFFF;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background 420ms ease, color 420ms ease;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  margin: 0;
  text-wrap: balance;
  letter-spacing: -0.02em;
  font-weight: 600;
}

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.hide { display: none !important; }

/* iconurile se scalează cu textul; regulile de mai jos le suprascriu punctual */
.ico { width: 1em; height: 1em; flex: none; vertical-align: -0.15em; }
.ctrl-b svg { width: 18px; height: 18px; }
.ctrl-b.main svg { width: 21px; height: 21px; }
.play-b svg, .send svg { width: 16px; height: 16px; }
.goal-ic svg, .rowitem .ri svg, .quick .qi svg, .setting .goal-ic svg { width: 17px; height: 17px; }
.tick svg, .check svg { width: 13px; height: 13px; }

/* ---------- semne de brand ---------- */

.mark { display: block; }
.mark .stroke { fill: none; stroke: var(--mark); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }

.orb {
  position: relative;
  border-radius: 50%;
  background:
    radial-gradient(circle at 36% 32%, var(--orb-core) 0%, var(--orb-mid) 46%, color-mix(in srgb, var(--orb-mid) 55%, #000) 100%);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--orb-mid) 40%, transparent),
              0 0 24px 4px var(--orb-glow);
  flex: none;
}
.orb::after {
  content: "";
  position: absolute;
  inset: -60%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--orb-glow) 0%, transparent 62%);
  opacity: 0.75;
  animation: breathe 4.2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes breathe {
  0%, 100% { transform: scale(0.86); opacity: 0.5; }
  50%      { transform: scale(1.12); opacity: 0.9; }
}

/* ---------- shell ---------- */

#shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) var(--panel); min-height: 100vh; }
#shell[data-panel="closed"] { grid-template-columns: var(--rail) minmax(0, 1fr) 0px; }

/* ---------- rail ---------- */

.rail {
  background: var(--bg-rail);
  border-right: 1px solid var(--line);
  padding: var(--sp-5) var(--sp-4);
  display: flex; flex-direction: column; gap: var(--sp-5);
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.rail-brand { display: flex; flex-direction: column; gap: 6px; padding: 0 6px; }
.tagline { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-3); }

.me { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--r-md); }
.me-name { font-weight: 600; font-size: 13.5px; }
.me-sub { font-size: 11.5px; color: var(--text-3); }
.badge-pro {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 4px;
  font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 999px;
  background: color-mix(in srgb, var(--gold) 18%, transparent);
  color: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 34%, transparent);
}

.genie-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: var(--sp-3); display: flex; flex-direction: column; gap: 10px;
}
.genie-card-head { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }
.genie-row { display: flex; gap: 10px; align-items: center; }
.genie-role { font-size: 11.5px; color: var(--text-2); line-height: 1.35; }
.dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); flex: none; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 11px; border-radius: var(--r-md);
  color: var(--text-2); font-size: 13.5px; text-align: left; width: 100%;
  transition: background 160ms ease, color 160ms ease;
}
.nav button:hover { background: var(--surface); color: var(--text); }
.nav button[aria-current="true"] { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.nav button[aria-current="true"] svg { color: var(--accent); }
.nav svg { width: 17px; height: 17px; flex: none; color: var(--text-3); }

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.streak {
  border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px;
  background: var(--surface); display: flex; flex-direction: column; gap: 7px;
}
.streak-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.bar { height: 5px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

/* ---------- main ---------- */

.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-6);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.search {
  flex: 1; display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 10px 16px; min-width: 0;
}
.search input { flex: 1; background: none; border: 0; outline: none; font-size: 13.5px; min-width: 0; }
.search input::placeholder { color: var(--text-3); }

.icon-btn {
  width: 38px; height: 38px; flex: none; display: grid; place-items: center;
  border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  color: var(--text-2); position: relative; transition: color 160ms, border-color 160ms;
}
.icon-btn:hover { color: var(--text); border-color: var(--line-2); }
.icon-btn .pip { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }

.persona-switch {
  display: flex; gap: 2px; padding: 3px; flex: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
}
.persona-switch button {
  padding: 6px 13px; border-radius: 999px; font-size: 12px; color: var(--text-3);
  white-space: nowrap; transition: background 200ms, color 200ms;
}
.persona-switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.view { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-6); max-width: 1180px; }

.greet-h { font-size: clamp(26px, 3.2vw, 36px); }
.greet-sub { color: var(--text-2); font-size: 15.5px; margin-top: 6px; }

.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--sp-3); }
.quick button {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 14px 16px; transition: transform 200ms ease, border-color 200ms ease, background 200ms ease;
}
.quick button:hover { transform: translateY(-2px); border-color: var(--line-2); background: var(--surface-2); }
.quick .qi { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.quick .qt { font-weight: 600; font-size: 13.5px; }
.quick .qs { font-size: 11.5px; color: var(--text-3); }

.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: -10px; }
.section-h h2 { font-size: 18px; }
.link-b { font-size: 12.5px; color: var(--accent); }
.link-b:hover { text-decoration: underline; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: var(--sp-4); }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  overflow: hidden; display: flex; flex-direction: column; text-align: left;
  transition: transform 240ms cubic-bezier(.2,.8,.3,1), border-color 240ms, box-shadow 240ms;
}
.card:hover { transform: translateY(-4px); border-color: var(--line-2); box-shadow: var(--shadow); }
.card-body { padding: 14px 15px 15px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.card-t { font-weight: 600; font-size: 14px; }
.card-s { font-size: 12px; color: var(--text-3); line-height: 1.45; }
.card-go { margin-top: auto; padding-top: 12px; display: flex; justify-content: flex-end; color: var(--accent); }

/* Arta procedurală pentru carduri — câte una per domeniu monitorizat.
   Fără imagini externe: totul e desenat din gradienți. */
.art { height: 112px; position: relative; overflow: hidden; }
.art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--art-veil), transparent 62%); }

/* TRAVEL */
.art--zbor   { background: linear-gradient(#1B2A5E 0%, #3A6BFF 55%, #86A8FF 100%); }
.art--zbor::before { content:""; position:absolute; inset:0; background:
  radial-gradient(46px 46px at 74% 30%, rgba(255,255,255,.85), transparent 62%),
  linear-gradient(115deg, transparent 44%, rgba(255,255,255,.5) 45%, transparent 46.5%); }
.art--oras   { background: linear-gradient(#F0A868 0%, #C96C58 46%, #3A2540 100%); }
.art--oras::before { content:""; position:absolute; inset:0; background:
  linear-gradient(to top, #241a2e 0 22%, transparent 22%),
  linear-gradient(90deg, transparent 10%, #2E2340 10% 18%, transparent 18% 28%, #2A203A 28% 34%, transparent 34% 48%, #33263F 48% 58%, transparent 58% 70%, #2C2138 70% 80%, transparent 80%);
  background-position: 0 0, 0 calc(100% - 4px); background-size: 100% 100%, 100% 46%; background-repeat: no-repeat; }
.art--plaja  { background: linear-gradient(#7FD3E8 0%, #2E9CC4 48%, #14607F 100%); }
.art--plaja::before{ content:""; position:absolute; inset:0; background:
  linear-gradient(to top, #E8D5A8 0 26%, transparent 26%),
  radial-gradient(38px 38px at 22% 26%, rgba(255,240,190,.9), transparent 62%); }

/* LIFESTYLE */
.art--sushi  { background: linear-gradient(#2A1418 0%, #6E2230 52%, #1A0D12 100%); }
.art--sushi::before{ content:""; position:absolute; inset:0; background:
  radial-gradient(22px 22px at 34% 52%, #F5F0E4 62%, transparent 64%),
  radial-gradient(9px 9px at 34% 52%, #E8624A 62%, transparent 64%),
  radial-gradient(22px 22px at 60% 62%, #F5F0E4 62%, transparent 64%),
  radial-gradient(9px 9px at 60% 62%, #2E6B4F 62%, transparent 64%); }
.art--cafea  { background: linear-gradient(#D9C3A5 0%, #9A7050 50%, #402A1C 100%); }
.art--cafea::before{ content:""; position:absolute; width:52px; height:52px; border-radius:50%; border:6px solid rgba(255,255,255,.55); left:calc(50% - 26px); top:28px; }
.art--masa   { background: linear-gradient(#3B2A22 0%, #7A5236 50%, #1E140F 100%); }
.art--masa::before { content:""; position:absolute; inset:0; background: radial-gradient(70px 50px at 50% 60%, rgba(255,206,140,.5), transparent 70%); }

/* CULTURĂ */
.art--arta   { background: linear-gradient(#141425 0%, #2E2A52 52%, #0C0C16 100%); }
.art--arta::before { content:""; position:absolute; inset:0; background:
  linear-gradient(#E8C46A 0 100%) 24% 30%/34px 46px no-repeat,
  linear-gradient(#5B7CD6 0 100%) 62% 38%/28px 36px no-repeat,
  radial-gradient(60px 40px at 44% 18%, rgba(255,240,200,.35), transparent 70%); }
.art--muzeu  { background: linear-gradient(#E7E2D6 0%, #B6AE9C 52%, #4A4638 100%); }
.art--muzeu::before{ content:""; position:absolute; inset:0; background:
  linear-gradient(90deg, transparent 18%, rgba(255,255,255,.6) 18% 23%, transparent 23% 38%, rgba(255,255,255,.6) 38% 43%, transparent 43% 58%, rgba(255,255,255,.6) 58% 63%, transparent 63% 78%, rgba(255,255,255,.6) 78% 83%, transparent 83%);
  background-position: 0 40%; background-size: 100% 55%; background-repeat: no-repeat; }
.art--teatru { background: linear-gradient(#3A0E1E 0%, #7C1D34 50%, #1A0710 100%); }
.art--teatru::before{ content:""; position:absolute; inset:0; background:
  repeating-linear-gradient(90deg, rgba(255,255,255,.09) 0 8px, transparent 8px 20px),
  radial-gradient(60px 40px at 50% 100%, rgba(255,200,120,.4), transparent 70%); }

/* EVENIMENTE */
.art--concert{ background: linear-gradient(#0B0B1C 0%, #241A52 50%, #0A0A14 100%); }
.art--concert::before{ content:""; position:absolute; inset:0; background:
  conic-gradient(from 200deg at 30% 0%, transparent 0 12deg, rgba(120,150,255,.5) 14deg, transparent 18deg),
  conic-gradient(from 160deg at 70% 0%, transparent 0 12deg, rgba(255,120,190,.42) 14deg, transparent 18deg),
  radial-gradient(90px 40px at 50% 100%, rgba(58,107,255,.5), transparent 70%); }
.art--festival{ background: linear-gradient(#122E44 0%, #2C6E8C 50%, #0A1A26 100%); }
.art--festival::before{ content:""; position:absolute; inset:0; background:
  radial-gradient(2px 2px at 22% 34%, #FFE9A8, transparent),
  radial-gradient(2px 2px at 48% 22%, #FFD5E8, transparent),
  radial-gradient(2px 2px at 70% 40%, #B8ECFF, transparent),
  radial-gradient(2px 2px at 86% 26%, #FFE9A8, transparent),
  radial-gradient(80px 36px at 50% 100%, rgba(255,220,150,.4), transparent 70%); }

/* SĂNĂTATE */
.art--farmacie{ background: linear-gradient(#0E3A2E 0%, #16A34A 52%, #08241C 100%); }
.art--farmacie::before{ content:""; position:absolute; inset:0; background:
  linear-gradient(#fff 0 100%) 50% 50%/46px 14px no-repeat,
  linear-gradient(#fff 0 100%) 50% 50%/14px 46px no-repeat; opacity:.9; }
.art--clinica { background: linear-gradient(#E6F0F6 0%, #A9C9DE 52%, #3E6076 100%); }
.art--clinica::before{ content:""; position:absolute; inset:0; background:
  linear-gradient(90deg, transparent 0 20%, rgba(255,255,255,.85) 20% 32%, transparent 32% 44%, rgba(58,107,255,.5) 44% 50%, transparent 50% 62%, rgba(255,255,255,.85) 62% 74%, transparent 74%);
  background-position: 0 50%; background-size: 100% 8px; background-repeat: no-repeat; }
.art--miscare { background: linear-gradient(#0F2A1F 0%, #2E7D5B 50%, #071711 100%); }
.art--miscare::before{ content:""; position:absolute; inset:0; background: radial-gradient(80px 60px at 40% 55%, rgba(160,255,210,.4), transparent 70%); }

/* CELE PATRU CATEGORII PRINCIPALE */
.art--sanatate { background: linear-gradient(#0E2A3A 0%, #1E6B7D 52%, #08161E 100%); }
.art--sanatate::before { content:""; position:absolute; inset:0; background:
  radial-gradient(70px 50px at 50% 55%, rgba(120,220,235,.45), transparent 70%),
  linear-gradient(#fff 0 100%) 50% 50%/34px 10px no-repeat,
  linear-gradient(#fff 0 100%) 50% 50%/10px 34px no-repeat; }
.art--oportunitati { background: linear-gradient(#1B2A5E 0%, #3A6BFF 52%, #0D1430 100%); }
.art--oportunitati::before { content:""; position:absolute; inset:0; background:
  radial-gradient(40px 40px at 70% 32%, rgba(255,255,255,.8), transparent 62%),
  linear-gradient(115deg, transparent 46%, rgba(255,255,255,.45) 47%, transparent 48.5%); }
.art--productivitate { background: linear-gradient(#241C10 0%, #6E5230 50%, #120D08 100%); }
.art--productivitate::before { content:""; position:absolute; inset:0; background:
  radial-gradient(60px 44px at 46% 58%, rgba(255,214,150,.5), transparent 70%),
  linear-gradient(90deg, transparent 24%, rgba(255,255,255,.14) 24% 26%, transparent 26% 44%, rgba(255,255,255,.14) 44% 46%, transparent 46%); }
.art--conexiune { background: linear-gradient(#2A1830 0%, #6B3A5E 48%, #120A16 100%); }
.art--conexiune::before { content:""; position:absolute; inset:0; background:
  radial-gradient(28px 28px at 38% 56%, rgba(255,200,220,.55), transparent 64%),
  radial-gradient(28px 28px at 60% 56%, rgba(180,200,255,.55), transparent 64%); }

/* GENERIC */
.art--via    { background: linear-gradient(#0D0D0F 0%, #1B2A5E 55%, #0D0D0F 100%); }
.art--via::before { content:""; position:absolute; inset:0; background: radial-gradient(70px 70px at 50% 46%, rgba(58,107,255,.7), transparent 66%); }
.art--noapte { background: linear-gradient(#0D0D14 0%, #1A1F3A 55%, #07070C 100%); }
.art--noapte::before{ content:""; position:absolute; inset:0; background:
  radial-gradient(1.6px 1.6px at 24% 32%, #fff, transparent),
  radial-gradient(1.4px 1.4px at 66% 24%, #fff, transparent),
  radial-gradient(1.7px 1.7px at 44% 60%, #fff, transparent),
  radial-gradient(1.3px 1.3px at 84% 64%, #fff, transparent); }

/* ---------- coloană dreapta din Acasă ---------- */

.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--sp-5); align-items: start; }
.panel-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-4); }
.panel-box + .panel-box { margin-top: var(--sp-4); }
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.panel-head h3 { font-size: 14.5px; }

.goal { display: flex; gap: 11px; align-items: center; padding: 9px 0; }
.goal + .goal { border-top: 1px solid var(--line); }
.goal-ic { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; background: var(--surface-3); }
.goal-b { flex: 1; min-width: 0; }
.goal-t { font-size: 12.5px; margin-bottom: 6px; }
.goal-v { font-size: 12px; color: var(--text-2); }

.quote { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-5); position: relative; overflow: hidden; }
.quote-mark { font-family: var(--font-serif); font-size: 48px; line-height: 0.7; color: var(--line-2); }
.quote p { font-family: var(--font-serif); font-size: 17px; line-height: 1.45; margin: 10px 0 12px; }
.quote cite { font-style: normal; font-size: 12px; color: var(--text-3); }

/* ---------- panoul Genie ---------- */

.gpanel {
  border-left: 1px solid var(--line); background: var(--bg-rail);
  display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; overflow: hidden;
}
#shell[data-panel="closed"] .gpanel { display: none; }
.gp-head { display: flex; align-items: center; gap: 9px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.gp-head .nm { font-weight: 600; font-size: 13.5px; flex: 1; }
.gp-body { flex: 1; overflow-y: auto; padding: var(--sp-5) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); }
.gp-hero { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: var(--sp-5) 0 var(--sp-3); }
.gp-hero p { color: var(--text-2); font-size: 13px; margin: 0; max-width: 220px; }

.msgs { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 15px; font-size: 13px; line-height: 1.5; animation: rise 320ms cubic-bezier(.2,.8,.3,1) both; }
.msg.g { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 5px; align-self: flex-start; }
.msg.u { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; align-self: flex-end; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.typing { display: flex; gap: 4px; align-self: flex-start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 15px 15px 15px 5px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: bob 1.1s infinite; }
.typing i:nth-child(2) { animation-delay: .16s; }
.typing i:nth-child(3) { animation-delay: .32s; }
@keyframes bob { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }

.chips { display: flex; flex-direction: column; gap: 8px; }
.chip {
  display: flex; align-items: center; gap: 9px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 10px 13px; font-size: 12.5px; transition: border-color 180ms, background 180ms, transform 180ms;
}
.chip:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateX(2px); }

.gp-foot { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.composer { display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 8px 8px 15px; }
.composer input { flex: 1; background: none; border: 0; outline: none; font-size: 13px; min-width: 0; }
.send { width: 31px; height: 31px; flex: none; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.demo-note { font-size: 10.5px; color: var(--text-3); text-align: center; letter-spacing: 0.02em; }

/* ---------- onboarding ---------- */

#onb { position: fixed; inset: 0; z-index: 200; background: var(--bg); overflow-y: auto; }
.onb-wrap { min-height: 100vh; display: flex; flex-direction: column; }
.onb-top { display: flex; align-items: center; justify-content: space-between; padding: 20px var(--sp-6); }
.steps { display: flex; gap: 6px; align-items: center; }
.steps i { width: 26px; height: 3px; border-radius: 999px; background: var(--line-2); transition: background 300ms, width 300ms; }
.steps i.on { background: var(--accent); width: 40px; }
.ghost-b { font-size: 12.5px; color: var(--text-3); padding: 7px 12px; border-radius: 999px; }
.ghost-b:hover { color: var(--text); background: var(--surface); }

.onb-stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--sp-5) var(--sp-6) var(--sp-8); }
.onb-step { width: 100%; max-width: 1080px; animation: fade 520ms cubic-bezier(.2,.8,.3,1) both; }
@keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.hello { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-8); align-items: center; }
.hello h1 { font-size: clamp(38px, 6vw, 62px); line-height: 1.03; font-weight: 300; letter-spacing: -0.035em; }
.hello h1 em { font-style: normal; color: var(--accent); font-weight: 500; }
.hello .lede { color: var(--text-2); font-size: 16px; max-width: 40ch; margin-top: var(--sp-5); }
.manifest { margin-top: var(--sp-6); display: flex; flex-direction: column; gap: 14px; }
.manifest div { display: flex; gap: 11px; align-items: flex-start; font-size: 14px; color: var(--text-2); }
.manifest svg { width: 18px; height: 18px; color: var(--accent); flex: none; margin-top: 2px; }

.orb-stage { display: grid; place-items: center; min-height: 380px; position: relative; }
.rings { position: absolute; inset: 0; display: grid; place-items: center; }
.rings i { position: absolute; border-radius: 50%; border: 1px solid var(--line-2); animation: expand 5s ease-out infinite; }
@keyframes expand { 0% { width: 90px; height: 90px; opacity: .85; } 100% { width: 420px; height: 420px; opacity: 0; } }

.btn {
  display: inline-flex; align-items: center; gap: 9px; justify-content: center;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px;
  padding: 13px 26px; border-radius: 999px; transition: transform 180ms, filter 180ms;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
.btn.sec { background: var(--surface); color: var(--text); border: 1px solid var(--line-2); }
.btn[disabled] { opacity: .4; pointer-events: none; }

.pick-head { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--sp-5); margin-bottom: var(--sp-5); flex-wrap: wrap; }
.pick-head h2 { font-size: clamp(24px, 3.4vw, 33px); font-weight: 400; }
.pick-head p { color: var(--text-3); margin: 6px 0 0; font-size: 13.5px; }

.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: var(--sp-4); }
.person {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  overflow: hidden; text-align: left; position: relative;
  transition: transform 220ms cubic-bezier(.2,.8,.3,1), border-color 220ms, box-shadow 220ms;
}
.person:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.person[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow); }
.person .tick {
  position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  opacity: 0; transform: scale(.6); transition: opacity 200ms, transform 200ms;
}
.person[aria-pressed="true"] .tick { opacity: 1; transform: none; }
.person-b { padding: 12px 13px 14px; }
.person-n { font-weight: 600; font-size: 14px; display: flex; align-items: baseline; gap: 7px; }
.person-n span { font-size: 11.5px; color: var(--text-3); font-weight: 400; }
.person-d { font-size: 11.5px; color: var(--text-2); margin-top: 3px; line-height: 1.4; }

.portrait { aspect-ratio: 1 / 1; position: relative; overflow: hidden; }
.portrait svg { width: 100%; height: 100%; display: block; }
.portrait::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, var(--art-veil), transparent 34%); }

.avatar { border-radius: 50%; overflow: hidden; position: relative; flex: none; }
.avatar svg { width: 100%; height: 100%; display: block; }

.tune { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: var(--sp-7); align-items: start; }
.tune-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: var(--sp-6); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.field { display: flex; flex-direction: column; gap: 10px; }
.field + .field { margin-top: var(--sp-5); }
.field-l { display: flex; align-items: center; gap: 9px; font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-3); }
.field-l svg { width: 15px; height: 15px; color: var(--accent); }
.text-in { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 12px 15px; font-size: 15px; width: 100%; outline: none; transition: border-color 180ms; }
.text-in:focus { border-color: var(--accent); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt {
  padding: 9px 16px; border-radius: 999px; font-size: 13px;
  background: var(--surface); border: 1px solid var(--line); color: var(--text-2);
  transition: all 180ms ease;
}
.opt:hover { border-color: var(--line-2); color: var(--text); }
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* ---------- VIA Relevance Score ---------- */

.rs { position: relative; flex: none; display: grid; place-items: center; }
.rs svg { transform: rotate(-90deg); display: block; }
.rs .rs-track { fill: none; stroke: var(--surface-3); }
.rs .rs-arc { fill: none; stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 900ms cubic-bezier(.2,.8,.3,1); }
.rs .rs-val {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-mono); font-weight: 600; letter-spacing: -0.04em; color: var(--text);
}
.rs-tag {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px;
  border-radius: 999px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  font-size: 11px; color: var(--accent); white-space: nowrap;
}
.rs-tag b { font-family: var(--font-mono); font-weight: 600; font-size: 12px; }
.rs-legenda { font-size: 11px; color: var(--text-3); letter-spacing: 0.02em; }

/* ---------- alerte ---------- */

.alerta {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-lg);
  background: var(--surface); text-align: left; width: 100%;
  transition: border-color 200ms, transform 200ms, background 200ms;
}
.alerta:hover { border-color: var(--line-2); transform: translateY(-2px); }
.alerta.noua { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.alerta .a-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-3); color: var(--accent); }
.alerta .a-cat { font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--text-3); }
.alerta .a-t { font-weight: 600; font-size: 14px; margin-top: 2px; }
.alerta .a-s { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
.alerta .a-meta { display: flex; align-items: center; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
.alerta .a-cand { font-size: 11px; color: var(--text-3); white-space: nowrap; }
.punct-nou { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); flex: none; }

/* ---------- VIA Health ---------- */

.health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--sp-4); }
.metric { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-4); }
.metric .m-l { font-size: 11.5px; color: var(--text-3); display: flex; align-items: center; gap: 7px; }
.metric .m-v { font-family: var(--font-mono); font-size: 26px; font-weight: 600; letter-spacing: -0.03em; margin-top: 8px; }
.metric .m-v small { font-family: var(--font-ui); font-size: 13px; font-weight: 400; color: var(--text-2); letter-spacing: 0; }
.metric .m-s { font-size: 11.5px; color: var(--text-2); margin-top: 4px; }
.spark-mini { display: flex; align-items: flex-end; gap: 3px; height: 30px; margin-top: 10px; }
.spark-mini i { flex: 1; background: var(--accent); border-radius: 2px; opacity: .55; }
.spark-mini i:last-child { opacity: 1; }

.audio-b {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 6px 12px 6px 10px; border-radius: 999px; font-size: 12px;
  background: var(--accent-soft); color: var(--accent); border: 1px solid transparent;
  transition: background 180ms, border-color 180ms;
}
.audio-b:hover { border-color: var(--accent); }
.audio-b.speaking { background: var(--accent); color: var(--accent-ink); }
.audio-b svg { width: 12px; height: 12px; }

.opt-audio { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.opt-sample {
  flex: 1; min-width: 200px; font-family: var(--font-serif); font-size: 14.5px;
  color: var(--text-2); line-height: 1.45; font-style: italic;
}

.preview {
  margin-top: var(--sp-5); background: var(--surface); border: 1px solid var(--accent);
  border-radius: var(--r-xl); padding: var(--sp-5);
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-5); align-items: center;
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.preview .pv-l { display: flex; flex-direction: column; gap: 4px; }
.preview .pv-n { font-size: 18px; font-weight: 600; }
.preview .pv-q { font-family: var(--font-serif); font-size: 16.5px; line-height: 1.45; margin: 6px 0 10px; }
.preview .pv-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.pv-tag { font-size: 11px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.pv-tag b { color: var(--text); font-weight: 600; }
.preview .pv-act { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
@media (max-width: 760px) { .preview { grid-template-columns: minmax(0, 1fr); text-align: left; } }

.applied { font-size: 11.5px; color: var(--good); display: flex; align-items: center; gap: 5px; }

.wave { display: flex; align-items: center; gap: 3px; height: 34px; flex: 1; }
.wave i { flex: 1; background: var(--accent); border-radius: 999px; opacity: .5; min-height: 3px; transition: height 120ms ease, opacity 120ms ease; }
.wave.playing i { opacity: 1; }
.voice-row { display: flex; align-items: center; gap: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 14px; }
.play-b { width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }

.onb-foot { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-4); padding: var(--sp-5) var(--sp-6) var(--sp-6); border-top: 1px solid var(--line); }
.onb-foot .hint { font-size: 12.5px; color: var(--text-3); }

/* ---------- demo „Cum funcționează VIA” ---------- */

.demo-hero { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--sp-5); flex-wrap: wrap; }
.demo-hero h1 { font-size: clamp(25px, 3.4vw, 34px); font-weight: 400; }
.demo-hero p { color: var(--text-2); margin: 8px 0 0; max-width: 52ch; }

.demo-ctrl { display: flex; align-items: center; gap: 8px; }
.ctrl-b { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; color: var(--text-2); transition: all 180ms; }
.ctrl-b:hover { color: var(--text); border-color: var(--accent); }
.ctrl-b.main { width: 50px; height: 50px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.rail-steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.rstep { text-align: left; display: flex; flex-direction: column; gap: 8px; opacity: .45; transition: opacity 300ms; }
.rstep.active, .rstep.done { opacity: 1; }
.rstep .rline { height: 3px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.rstep .rline > i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 999px; }
.rstep.done .rline > i { width: 100%; }
.rstep .rn { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); }
.rstep .rt { font-size: 13px; font-weight: 600; }

.stage {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl);
  padding: var(--sp-6); min-height: 420px; position: relative; overflow: hidden;
}
.stage-in { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--sp-6); align-items: start; }
.stage-t { font-size: 22px; font-weight: 400; margin-bottom: 6px; }
.stage-d { color: var(--text-2); font-size: 13.5px; max-width: 46ch; }

.feed { display: flex; flex-direction: column; gap: 8px; margin-top: var(--sp-5); }
.sig {
  display: flex; align-items: center; gap: 11px; padding: 10px 13px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md);
  font-size: 12.5px; opacity: 0; transform: translateY(6px); transition: opacity 380ms, transform 380ms;
}
.sig.in { opacity: 1; transform: none; }
.sig .sd { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.sig .st { flex: 1; }
.sig .sv { color: var(--text-3); font-size: 11.5px; }

.counter { display: flex; flex-direction: column; gap: 2px; }
.counter .cv { font-family: var(--font-mono); font-size: 34px; font-weight: 600; letter-spacing: -0.03em; }
.counter .cl { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }

.opt-table { margin-top: var(--sp-5); display: flex; flex-direction: column; gap: 6px; }
.orow {
  display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--surface-2); font-size: 13px; opacity: .3; transition: all 380ms;
}
.orow.in { opacity: 1; }

/**
 * Ce a salvat ca să nu piardă. Reținem strictul necesar ca să putem face pe urmă
 * un fișier de calendar: titlu, când, unde, legătura spre sursă.
 */
const SALVATE = [];

/** Cu cât înainte vrea să fie anunțat — timpul de ajuns acolo, plus pregătirea. */
const MINUTE_INAINTE = 45;

const esteSalvat = (a) => SALVATE.some((x) => x.titlu === a.t);

function salveazaCard(a) {
  const i = SALVATE.findIndex((x) => x.titlu === a.t);
  if (i >= 0) SALVATE.splice(i, 1);
  else if (a.start) {
    SALVATE.push({
      titlu: a.t, start: a.start, sfarsit: a.sfarsit || null,
      locatie: a.locatie || null, url: a.url || null, scor: a.scor,
    });
    SALVATE.sort((x, y) => Date.parse(x.start) - Date.parse(y.start));
  }
  try { localStorage.setItem(CHEIE_SALVATE, JSON.stringify(SALVATE)); } catch (e) { /* stocare blocată */ }
}

function incarcaSalvate() {
  try {
    const s = JSON.parse(localStorage.getItem(CHEIE_SALVATE) || '[]');
    if (Array.isArray(s)) SALVATE.push(...s.filter((x) => x && x.titlu && x.start));
  } catch (e) { /* nimic salvat */ }
}

/** Doar ce n-a trecut încă. Ce s-a terminat nu mai are ce căuta în listă. */
function salvateViitoare() {
  const acum = Date.now();
  return SALVATE.filter((x) => Date.parse(x.sfarsit || x.start) > acum);
}

/** „Pleci vineri la 15:15" — ora la care trebuie să se miște, nu ora evenimentului. */
function oraPlecarii(iso) {
  return new Date(Date.parse(iso) - MINUTE_INAINTE * 60000);
}

/**
 * Fișier de calendar pentru un eveniment salvat, cu o singură amintire — la ora
 * la care trebuie să plece, nu cu o săptămână înainte. Merge în Google Calendar,
 * Outlook, Apple Calendar: toate citesc formatul ăsta.
 */
function fisierCalendar(x) {
  const ceas = (d) => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const scapa = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/[,;]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
  const sfarsit = x.sfarsit || new Date(Date.parse(x.start) + 2 * 3600e3).toISOString();

  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//VIA//Agenda personala//RO',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:via-' + Math.abs([...x.titlu].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7)) + '@via.app',
    'DTSTAMP:' + ceas(Date.now()),
    'DTSTART:' + ceas(x.start),
    'DTEND:' + ceas(sfarsit),
    'SUMMARY:' + scapa(x.titlu),
    x.locatie ? 'LOCATION:' + scapa(x.locatie) : '',
    x.url ? 'URL:' + scapa(x.url) : '',
    'DESCRIPTION:' + scapa('Salvat din VIA. Relevanță ' + x.scor + '/100.' + (x.url ? '\n' + x.url : '')),
    'BEGIN:VALARM',
    'TRIGGER:-PT' + MINUTE_INAINTE + 'M',
    'ACTION:DISPLAY',
    'DESCRIPTION:' + scapa('E timpul să pleci spre ' + (x.locatie || x.titlu)),
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR',
  ].filter(Boolean).join('\r\n');
}

/**
 * Descărcările sunt blocate în vizualizatorul de artifacts al Claude, iar `.ics`
 * nu e printre tipurile pe care le acceptă. Acolo trimitem omul în Google Calendar
 * printr-o legătură obișnuită; peste tot altundeva rămâne fișierul, care duce cu el
 * și amintirea la ora plecării.
 */
const potDescarca = () => !window.claude;

/** Legătură care deschide Google Calendar cu evenimentul deja completat. */
function linkGoogleCalendar(x) {
  const ceas = (d) => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const sfarsit = x.sfarsit || new Date(Date.parse(x.start) + 2 * 3600e3).toISOString();
  const q = new URLSearchParams({
    action: 'TEMPLATE',
    text: x.titlu,
    dates: ceas(x.start) + '/' + ceas(sfarsit),
    details: 'Salvat din VIA. Relevanță ' + x.scor + '/100.' + (x.url ? '\n' + x.url : ''),
  });
  if (x.locatie) q.set('location', x.locatie);
  return 'https://calendar.google.com/calendar/render?' + q.toString();
}

/** Pune evenimentul în calendar, pe calea care merge în contextul curent. */
function pupCalendar(x) {
  if (!potDescarca()) { window.open(linkGoogleCalendar(x), '_blank', 'noopener'); return 'google'; }
  descarcaCalendar(x);
  return 'fisier';
}

/** Descarcă fișierul de calendar. Numele e curățat ca să fie valid pe orice sistem. */
function descarcaCalendar(x) {
  const bloc = new Blob([fisierCalendar(x)], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(bloc);
  a.download = 'via-' + x.titlu.normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40).toLowerCase() + '.ics';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/**
 * Ce a plăcut și ce nu. Din lista asta se hrănește stratul „preferințe învățate":
 * fiecare notă mută scorul ieșirilor de același gen sau din același loc, iar VIA
 * devine mai sigură pe măsură ce adună — nu dintr-o singură apăsare.
 */
const ISTORIC = [];

/** Nota dată unui card, dacă i s-a dat vreuna. */
function notaCard(a) {
  const h = ISTORIC.find((x) => x.titlu === a.t);
  return h ? h.verdict : 0;
}

/** Notează un card. Aceeași intrare notată din nou înlocuiește nota veche. */
function noteaza(a, verdict) {
  const i = ISTORIC.findIndex((x) => x.titlu === a.t);
  if (i >= 0) {
    // A doua apăsare pe același buton șterge nota: omul se poate răzgândi complet.
    if (ISTORIC[i].verdict === verdict) { ISTORIC.splice(i, 1); }
    else { ISTORIC[i].verdict = verdict; }
  } else {
    ISTORIC.push({ titlu: a.t, categorie: a.categorie, locatie: a.locatie || null, verdict });
  }
  salveazaIstoric();
}

function salveazaIstoric() {
  try { localStorage.setItem(CHEIE_ISTORIC, JSON.stringify(ISTORIC.slice(-120))); } catch (e) { /* stocare blocată */ }
}

function incarcaIstoric() {
  try {
    const salvat = JSON.parse(localStorage.getItem(CHEIE_ISTORIC) || '[]');
    if (Array.isArray(salvat)) ISTORIC.push(...salvat.filter((h) => h && h.titlu && h.verdict));
  } catch (e) { /* nimic salvat sau stocare blocată */ }
}

/** Profilul rămâne între vizite. Dacă browserul refuză stocarea, mergem mai departe. */

    }));
  } catch (e) { /* fereastră privată sau stocare blocată — profilul trăiește doar în sesiune */ }
}

function incarcaGust() {
  let salvat = null;
  try { salvat = JSON.parse(localStorage.getItem(CHEIE_STOCARE) || 'null'); } catch (e) { salvat = null; }
  if (!salvat) return;
  if (Number(salvat.buget) > 0) GUST.buget = Number(salvat.buget);
  if (Array.isArray(salvat.seriLibere)) GUST.seriLibere = salvat.seriLibere.filter((z) => z >= 0 && z <= 6);
  if (Array.isArray(salvat.artisti)) GUST.artisti = salvat.artisti;
  if (Array.isArray(salvat.locuri)) GUST.locuri = salvat.locuri.filter(Boolean);
  if (CATEGORII[salvat.focus]) GUST.focus = salvat.focus;
  if (Array.isArray(salvat.oprite)) {
    const oprite = new Set(salvat.oprite);
    for (const [k, lista] of Object.entries(INTERESE)) {
      lista.forEach((it, i) => { it.on = !oprite.has(k + ':' + i); });
    }
  }
}

/** „80 de intrări", dar „15 intrări": româna cere „de" de la 20 în sus. */
function cuDe(n, substantiv) {
  const ultimele = n % 100;
  return n + (ultimele === 0 || ultimele >= 20 ? ' de ' : ' ') + substantiv;
}

/** Câte semnale au fost verificate și câte au ajuns la om — cifre reale când le avem. */

/** „acum 2 ore", „ieri", „acum 3 zile" — de când e alerta. */
function candAlerta(iso) {
  if (!iso) return 'acum';
  const min = (Date.now() - Date.parse(iso)) / 60000;
  if (min < 60) return 'acum ' + Math.max(1, Math.round(min)) + ' min';
  if (min < 24 * 60) return 'acum ' + Math.round(min / 60) + ' ore';
  if (min < 48 * 60) return 'ieri';
  return 'acum ' + Math.round(min / (24 * 60)) + ' zile';
}

/**
 * Selecția de weekend — ritualul de joi seara.
 *
 * Apare într-o fereastră anume: de joi de la 18:00 până duminică seara. În rest
 * nu există, pentru că un ritual care e disponibil oricând nu mai e un ritual.
 * Ia din agendă ce cade în weekend și păstrează trei lucruri, nu zece.
 */
function selectiaDeWeekend() {
  if (!AGENDA_META) return null;

  const acum = new Date();
  const zi = acum.getDay();                 // 0 = duminică
  // Joi e ziua livrării; selecția rămâne pe ecran până se termină weekendul.
  const inFereastra = zi === 4 || zi === 5 || zi === 6 || zi === 0;
  if (!inFereastra) return null;

  // Ce cade vineri, sâmbătă sau duminică și n-a trecut încă.
  const carduri = ALERTE.filter((a) => {
    if (!a.start || !a.categorie) return false;
    const sfarsit = Date.parse(a.sfarsit || a.start);
    if (sfarsit < acum.getTime()) return false;
    const z = new Date(a.start).getDay();
    // Ce ține mai multe zile prinde weekendul oricum.
    return z === 5 || z === 6 || z === 0 || (a.sfarsit && a.sfarsit !== a.start);
  }).slice(0, 3);

  if (!carduri.length) return null;

  return {
    carduri,
    cand: zi === 4 ? 'joi seara, pentru weekend' : 'selecția ta de weekend',
    intro: carduri.length === 3
      ? 'Trei lucruri pentru zilele astea, alese din ' + AGENDA_META.citite
        + ' pe care le-am verificat. Atât — restul n-ar fi meritat drumul.'
      : (carduri.length === 1 ? 'Un singur lucru' : carduri.length + ' lucruri')
        + ' pentru weekendul ăsta. Puțin, dar exact ce trebuie.',
  };
}

 * pe baza vie; dacă nu, motorul e chiar în pagină și lucrează pe instantaneu.
 * Așa, alegerile schimbă efectiv rezultatele și în varianta de partajat.
 */
function reimprospateazaAgenda() {
  if (typeof window.VIA_AGENDA === 'function') {
    return Promise.resolve(window.VIA_AGENDA(FEREASTRA)).catch(() => null);
  }
  if (window.VIA_MOTOR) {
    const p = window.VIA.profil();

      fereastra: FEREASTRA,
      limita: 24,
      profil: {

        locuri: p.locuri,
        bugetSeara: p.buget,
        seriLibere: p.seriLibere,

      },
    });
    instaleazaAgenda(rez.carduri, { ...rez, ...window.VIA_MOTOR.instantaneu, intrari: undefined });

  }
  return Promise.resolve(null);
}

function instaleazaAgenda(carduri, meta) {

  const dupaScor = (a, b) => b.scor - a.scor;

    ...[...carduri].sort(dupaScor),
    ...ALERTE_SCRIPT.filter((a) => FARA_SURSA.has(a.cat)).sort(dupaScor),

  const potriviti = companioniPotriviti(COMPANIONS.filter((c) => c.grup === P().grupCompanioni));

function pasAlegere() {
  const grup = P().grupCompanioni;
  const toti = COMPANIONS.filter((c) => c.grup === grup);
  const potriviti = new Set(companioniPotriviti(toti).map((c) => c.id));

  // Întâi cei care se ocupă de ce l-a interesat; restul rămân disponibili dedesubt.
  const lista = [...toti].sort((a, b) => (potriviti.has(b.id) ? 1 : 0) - (potriviti.has(a.id) ? 1 : 0));

  const sel = companionCurent();
  const spec = CATEGORII[sel.spec];
  const ales = CATEGORII[GUST.focus];

  return '<div class="onb-step">' +
    '<div class="pick-head">' +
      '<div><h2>Alege companionul tău Genie</h2>' +
      '<p>VIA e sistemul care urmărește. Genie e vocea care îți vorbește. ' +
      (potriviti.size
        ? 'Ai spus că vrei ajutor la <b style="color:var(--text)">' + esc(ales.t.toLowerCase()) + '</b>, '
          + 'așa că ți-i arăt întâi pe cei ' + potriviti.size + ' care se ocupă de asta.'
        : 'Fiecare vine cu tonul lui și cu o categorie pe care o urmărește cu prioritate — și se aplică pe loc.') +
      '</p></div>' +
      '<div class="persona-switch" data-role="persona">' +
        Object.keys(PERSONAS).map((k) =>
          '<button data-persona="' + k + '" aria-pressed="' + (k === state.persona) + '">' + PERSONAS[k].eticheta + '</button>').join('') +
      '</div>' +
    '</div>' +

    '<div class="people">' + lista.map((c) =>
      '<button class="person" data-companion="' + c.id + '" aria-pressed="' + (c.id === state.genie.companion) + '">' +
        '<div class="tick">' + icon('check') + '</div>' +
        (potriviti.has(c.id)
          ? '<span class="pv-tag" style="position:absolute;top:10px;left:10px;z-index:2;background:var(--accent);' +
            'color:var(--accent-ink);border-color:var(--accent);font-weight:600">Potrivit</span>'
          : '') +
        portret(c) +
        '<div class="person-b"><div class="person-n">' + esc(c.nume) + ' <span>' + c.varsta + ' ani</span></div>' +
        '<div class="person-d">' + esc(c.desc) + '</div>' +
        '<div class="person-d" style="color:var(--accent);margin-top:5px">' + esc(CATEGORII[c.spec].t) + '</div></div>' +
      '</button>').join('') +
    '</div>' +

    '<div class="preview">' +
      portretMare(sel) +
      '<div class="pv-l">' +
        '<div class="pv-n">' + esc(sel.nume) + ' <span style="font-weight:400;color:var(--text-3);font-size:13px">· ' + esc(spec.t) + '</span></div>' +
        '<div class="pv-q">„' + esc(sel.salut) + '”</div>' +
        '<div class="pv-tags">' +
          '<span class="pv-tag">Voce <b>' + esc(sel.voce) + '</b></span>' +
          '<span class="pv-tag">Personalitate <b>' + esc(sel.pers) + '</b></span>' +
          '<span class="pv-tag">Ton <b>' + esc(sel.ton) + '</b></span>' +
        '</div>' +

/**

          'La ' + esc(CATEGORII[grup].t.toLowerCase()) + ', mă interesează</div>' +

            esc(x.it.scurt || x.it.t) + '</button>').join('') + '</div>' +
          // Nu toate categoriile au încă sursă de date. Spunem asta, în loc să

            esc(b.t) + '</button>').join('') + '</div>' +
          '<div style="font-size:12px;color:var(--text-3);margin-top:2px">' +

        '<div class="field"><div class="field-l">' + icon('cal') + 'Serile în care sunt liber</div>' +
          '<div class="opts">' + ZILE_SCURT.map((z, i) =>

              a.aratate + '</div>' +
            '<div style="font-size:13px;color:var(--text-2);margin-top:2px">' +
              (a.aratate === 1 ? 'lucru trece pragul' : 'lucruri trec pragul') + ' de ' + a.prag + '</div></div>' +

    '</div>' +
  '</div>';
}

/* ============================================================
   Voce — sinteză locală în browser (Web Speech API).
   Nu iese nimic în rețea; folosește vocile instalate pe sistem.
   ============================================================ */

/* Rescriere fonetică pentru o voce italiană: „ț” se citește corect ca „z”,
   „ș” ca „sc/sci”, iar „ă/â/î” se apropie cel mai bine de „a/i”. */
const FONETIC_IT = [
  [/[țţ]/g, 'z'], [/[ȚŢ]/g, 'Z'],
  [/[șş](?=[eiEI])/g, 'sc'], [/[șş]/g, 'sci'],
  [/[ȘŞ](?=[eiEI])/g, 'Sc'], [/[ȘŞ]/g, 'Sci'],
  [/ă/g, 'a'], [/Ă/g, 'A'],
  [/[âî]/g, 'i'], [/[ÂÎ]/g, 'I'],
  [/j(?=[eiEI])/g, 'g'], [/j/g, 'gi'],
  [/J(?=[eiEI])/g, 'G'], [/J/g, 'Gi'],
];

/* Pentru orice altă limbă: măcar litere pe care le poate pronunța. */
const FARA_DIACRITICE = [
  [/[ăâ]/g, 'a'], [/[ĂÂ]/g, 'A'],
  [/î/g, 'i'], [/Î/g, 'I'],
  [/[șş]/g, 's'], [/[ȘŞ]/g, 'S'],
  [/[țţ]/g, 't'], [/[ȚŢ]/g, 'T'],
];

const Voce = {
  suportat: typeof window !== 'undefined' && 'speechSynthesis' in window,
  voci: [],
  avertizat: false,
  notificat: false,

  init() {
    if (!this.suportat) return;
    const ia = () => {
      this.voci = window.speechSynthesis.getVoices() || [];
      /* vocile se încarcă asincron — actualizez nota fără să re-randez pasul */
      const nota = document.getElementById('notaVoce');
      if (nota && this.voci.length) nota.textContent = descriereVoce();
    };
    ia();
    window.speechSynthesis.addEventListener('voiceschanged', ia);
  },

  /* Româna e prima alegere. Când lipsește, italiana e cea mai apropiată
     fonetic (aceleași reguli pentru ce/ci/ge/gi/che/chi), apoi spaniola. */
  alege() {
    const v = this.voci;
    if (!v.length) return null;
    const prin = (re) => v.find((x) => re.test(x.lang));
    return prin(/^ro/i) || prin(/^it/i) || prin(/^es/i) || prin(/^pt/i) || prin(/^fr/i) ||
           v.find((x) => x.default) || v[0];
  },

  /* Textul afișat rămâne cu diacritice corecte. Doar ce se trimite spre
     rostire e rescris, ca vocea disponibilă să nu se împiedice de ele. */
  pregateste(text, lang) {
    let t = String(text)
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2190}-\u{21FF}]/gu, '')
      .replace(/[„”"*_`]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    if (/^ro/i.test(lang || '')) return t;
    const reguli = /^it/i.test(lang || '') ? FONETIC_IT : FARA_DIACRITICE;
    for (const [re, cu] of reguli) t = t.replace(re, cu);
    return t;
  },

  opreste() {
    if (this.suportat) window.speechSynthesis.cancel();
  },

  /* pitch/rate rezultă din combinația voce + personalitate + stil */
  parametri(over) {
    const g = state.genie;
    const v = gasesteVoce(over && over.voce || g.voce);
    const p = gasestePers(over && over.personalitate || g.personalitate);
    const s = gasesteStil(over && over.stil || g.stil);
    return {
      pitch: Math.min(2, Math.max(0.4, v.pitch + p.dp)),
      rate:  Math.min(1.6, Math.max(0.5, v.rate + p.dr + s.dr)),
    };
  },

  spune(text, over, laStart, laFinal) {
    if (!this.suportat) {
      if (!this.avertizat) {
        this.avertizat = true;
        toast('Vocea nu e disponibilă', 'Browserul acesta nu are sintetizator vocal. Încearcă în Chrome sau Edge.');
      }
      if (laFinal) laFinal();
      return false;
    }
    window.speechSynthesis.cancel();
    const v = this.alege();
    const lang = v ? v.lang : 'ro-RO';

    if (v && !/^ro/i.test(lang) && !this.notificat) {
      this.notificat = true;
      toast('Nu am găsit o voce românească',
        'Folosesc „' + v.name + '” și adaptez textul fonetic. Pentru pronunție corectă, instalează pachetul de voce Română din Setări → Oră și limbă → Vorbire.');
    }

    const u = new SpeechSynthesisUtterance(this.pregateste(text, lang));
    if (v) { u.voice = v; }
    u.lang = lang;
    const par = this.parametri(over);
    u.pitch = par.pitch;
    u.rate = par.rate;
    u.onstart = () => { if (laStart) laStart(); };
    u.onend = u.onerror = () => { if (laFinal) laFinal(); };
    window.speechSynthesis.speak(u);
    /* unele browsere nu declanșează onstart imediat */
    setTimeout(() => { if (laStart) laStart(); }, 30);
    return true;
  },
};
Voce.init();

/* Ce voce s-a găsit efectiv pe dispozitiv — util în demo. */
function descriereVoce() {
  const baza = 'Vocea e redată de sintetizatorul instalat pe dispozitivul tău, ca să auzi diferența dintre setări. ';
  if (!Voce.suportat) return baza + 'Browserul acesta nu are sintetizator vocal — încearcă în Chrome sau Edge.';
  const v = Voce.alege();
  if (!v) return baza + 'Se încarcă vocile disponibile…';
  if (/^ro/i.test(v.lang)) {
    return baza + 'Voce românească găsită: „' + v.name + '”. Pronunția e corectă.';
  }
  return baza + 'Nu există voce românească instalată, așa că folosesc „' + v.name + '” (' + v.lang +
    ') și rescriu textul fonetic înainte de rostire. Pentru pronunție corectă, instalează pachetul Română din ' +
    'Setări → Oră și limbă → Vorbire → Gestionare voci.';
}

/* butonul standard „ascultă” */
function butonAudio(text, over, eticheta) {
  return '<button class="audio-b" data-audio="' + esc(text) + '"' +
    (over ? " data-over='" + esc(JSON.stringify(over)) + "'" : '') + ' aria-label="Ascultă exemplul">' +
    icon('play') + (eticheta ? '<span>' + esc(eticheta) + '</span>' : '') + '</button>';
}

/**
 * Pașii de onboarding, în ordine. Gustul vine înaintea companionului: odată ce
 * știm cu ce vrea ajutor, îi arătăm doar companionii potriviți, nu toată lista.
 */
const PASI_ONB = [pasSalut, pasGust, pasAlegere, pasPersonalizare];

function randPicioareOnb() {
  const p = state.pasOnb;
  const ultim = PASI_ONB.length - 1;
  const texte = [
    'Durează un minut. Poți schimba orice, oricând.',
    'Cu cât îi spui mai mult, cu atât filtrează mai bine.',
    'Ți-i arăt întâi pe cei potriviți cu ce ai ales. Nimic nu e definitiv.',
    'Gata. De acum, Genie vorbește pe limba ta.',
  ];
  const butoane = ['Să începem', 'Alege-ți companionul', 'Personalizează-l', 'Intră în VIA'];

  return '<div class="onb-foot">' +
    (p > 0 ? '<button class="btn sec" data-act="inapoi">' + icon('prev') + 'Înapoi</button>' : '<span class="hint">' + texte[0] + '</span>') +
    (p > 0 ? '<span class="hint">' + texte[p] + '</span>' : '') +
    '<button class="btn" data-act="' + (p === ultim ? 'start' : 'inainte') + '">' +
      butoane[p] + icon('arrow') + '</button>' +
  '</div>';
}

function legaOnb() {
  const root = el('onb');
  root.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if (a === 'inainte') {
      state.pasOnb++;
      // La intrarea în pasul de alegere, propunem deja un companion potrivit cu
      // ce a cerut: omul vede o alegere făcută pentru el, nu o listă neutră.
      if (PASI_ONB[state.pasOnb] === pasAlegere) propuneCompanion();
      randOnb();
    }
    else if (a === 'inapoi') { state.pasOnb--; randOnb(); }
    else if (a === 'skip' || a === 'start') { intraInApp(a === 'start'); }
    else if (a === 'voce') { redaVoce(b); }
  }));
  root.querySelectorAll('[data-companion]').forEach((b) => b.addEventListener('click', () => {
    aplicaCompanion(b.dataset.companion, true);
    randOnb();
  }));
  root.querySelectorAll('[data-persona]').forEach((b) => b.addEventListener('click', () => {
    setPersona(b.dataset.persona, false);
    randOnb();
  }));
  root.querySelectorAll('[data-set]').forEach((b) => b.addEventListener('click', () => {
    const camp = b.dataset.set, val = b.dataset.val;
    state.genie[camp] = val;
    randOnb();
    const ex = camp === 'voce' ? gasesteVoce(val).ex : camp === 'personalitate' ? gasestePers(val).ex : gasesteStil(val).ex;
    Voce.spune(ex, null, undaPornire, undaOprire);
  }));
  /* Pasul de gust: fiecare apăsare schimbă profilul, recalculează agenda și
     redesenează pasul, ca numărul din dreapta să se miște sub ochii omului. */
  const dupaSchimbare = () => { salveazaGust(); reimprospateazaAgenda().then(randOnb); };

  root.querySelectorAll('[data-focus]').forEach((b) => b.addEventListener('click', () => {
    GUST.focus = b.dataset.focus;
    salveazaGust();
    randOnb();
  }));

  root.querySelectorAll('[data-gust]').forEach((b) => b.addEventListener('click', () => {
    const [grup, i] = b.dataset.gust.split(':');
    const it = INTERESE[grup][Number(i)];
    it.on = !it.on;
    dupaSchimbare();
  }));
  root.querySelectorAll('[data-buget]').forEach((b) => b.addEventListener('click', () => {
    GUST.buget = Number(b.dataset.buget);
    dupaSchimbare();
  }));
  root.querySelectorAll('[data-zi]').forEach((b) => b.addEventListener('click', () => {
    const z = Number(b.dataset.zi);
    GUST.seriLibere = GUST.seriLibere.includes(z)
      ? GUST.seriLibere.filter((x) => x !== z)
      : [...GUST.seriLibere, z].sort();
    dupaSchimbare();
  }));

  const inp = el('numeGenie');
  if (inp) inp.addEventListener('input', () => {
    state.genie.nume = inp.value.trim() || 'Genie';

  state.genie.voce = c.voce;

/* --- waveform legat de redarea reală --- */
let undaTimer = null;

function undaPornire() {
  const wave = el('wave');
  if (!wave || undaTimer) return;
  wave.classList.add('playing');
  let n = 0;
  undaTimer = setInterval(() => {
    n++;
    [...wave.children].forEach((b, i) => {
      b.style.height = (5 + Math.abs(Math.sin((n + i * 1.7) / 2.2)) * 27).toFixed(0) + 'px';
    });
  }, 70);
}

function undaOprire() {
  const wave = el('wave');
  if (undaTimer) { clearInterval(undaTimer); undaTimer = null; }
  if (wave) {
    wave.classList.remove('playing');
    [...wave.children].forEach((b, i) => { b.style.height = (8 + ((i * 7) % 24)) + 'px'; });
  }
  document.querySelectorAll('.audio-b.speaking').forEach((b) => b.classList.remove('speaking'));
  document.querySelectorAll('[data-act="voce"]').forEach((b) => { b.innerHTML = icon('play'); });
}

function redaVoce(btn) {
  const ex = gasesteVoce(state.genie.voce).ex;
  if (window.speechSynthesis && window.speechSynthesis.speaking) { Voce.opreste(); undaOprire(); return; }
  btn.innerHTML = icon('pause');
  Voce.spune(ex, null, undaPornire, undaOprire);
}

function scrieApoi(linii, i) {
  i = i || 0;
  if (i >= linii.length) {
    if (state.voceRaspuns) Voce.spune(linii.join(' '), null, undaPornire, undaOprire);
    return;
  }
  const m = el('msgs');
  if (!m) return;
  m.insertAdjacentHTML('beforeend', '<div class="typing" id="typ"><i></i><i></i><i></i></div>');
  jos();
  setTimeout(() => {
    const t = el('typ');
    if (t) t.remove();
    adaugaMesaj('g', linii[i]);
    setTimeout(() => scrieApoi(linii, i + 1), 520);
  }, 700 + Math.min(linii[i].length * 11, 1400));
}

let fluxLive = null;

function fluxStart() {
  const m = el('msgs');
  if (!m) return;
  const hero = document.querySelector('.gp-hero');
  if (hero) hero.remove();
  m.insertAdjacentHTML('beforeend', '<div class="typing" id="typ"><i></i><i></i><i></i></div>');
  jos();
}

function fluxDelta(text) {
  const t = el('typ');
  if (t) t.remove();
  if (!fluxLive) {
    const m = el('msgs');
    if (!m) return;
    state.chat.push({ rol: 'g', text: '' });
    m.insertAdjacentHTML('beforeend', '<div class="msg g" id="fluxLive"></div>');
    fluxLive = el('fluxLive');
  }
  const ultim = state.chat[state.chat.length - 1];
  ultim.text += text;
  fluxLive.innerHTML = esc(ultim.text).replace(/\n/g, '<br>');
  jos();
}

function fluxStop() {
  const t = el('typ');
  if (t) t.remove();
  const ultim = state.chat[state.chat.length - 1];
  if (fluxLive) { fluxLive.removeAttribute('id'); fluxLive = null; }
  jos();
  if (state.voceRaspuns && ultim && ultim.rol === 'g' && ultim.text) {
    Voce.spune(ultim.text, null, undaPornire, undaOprire);
  }
}

function trimiteMesaj(text) {
  adaugaMesaj('u', text);

  if (chips) chips.remove();
  if (typeof window.VIA_LIVE === 'function') { window.VIA_LIVE(text); return; }

  for (const c of CUVINTE) { if (c.k.some((k) => t.includes(k))) { r = c.r; break; } }

}

let rafId = null;

function pregatesteDemo() {
  state.demo.pas = 0; state.demo.elapsed = 0; state.demo.deschise = {};
  randPasDemo();
  actualizeazaRail(0);
  porneste();
}

function porneste() {
  state.demo.ruleaza = true;
  state.demo.t0 = performance.now() - state.demo.elapsed;
  const b = el('btnPlay'); if (b) b.innerHTML = icon('pause');
  if (rafId) cancelAnimationFrame(rafId);
  bucla();
}

function opreste() {
  state.demo.ruleaza = false;
  const b = el('btnPlay'); if (b) b.innerHTML = icon('play');
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
}

function bucla() {
  if (!state.demo.ruleaza) return;
  const pas = PASI_DEMO[state.demo.pas];
  state.demo.elapsed = performance.now() - state.demo.t0;
  const t = pas.durata ? Math.min(state.demo.elapsed / pas.durata, 1) : 1;
  animaPas(pas.id, t);
  actualizeazaRail(t);
  if (pas.durata && t >= 1) {
    if (state.demo.pas < PASI_DEMO.length - 1) { mergiLa(state.demo.pas + 1); return; }
    opreste();
  }
  rafId = requestAnimationFrame(bucla);
}

function mergiLa(i) {
  state.demo.pas = Math.max(0, Math.min(PASI_DEMO.length - 1, i));
  state.demo.elapsed = 0;
  state.demo.t0 = performance.now();
  randPasDemo();
  actualizeazaRail(0);
  if (state.demo.pas === PASI_DEMO.length - 1) {
    opreste();
    setTimeout(() => animaPas('rezultat', 1), 60);
    if (state.vedere === 'demo') toast(state.genie.nume + ' are ceva pentru tine', '3 lucruri, din 1.284 verificate azi.');
  } else if (state.demo.ruleaza) {
    porneste();
  }
}

function actualizeazaRail(t) {
  const r = el('railSteps');
  if (!r) return;
  [...r.children].forEach((b, i) => {
    b.classList.toggle('active', i === state.demo.pas);
    b.classList.toggle('done', i < state.demo.pas);
    const fill = b.querySelector('.rline > i');
    if (i < state.demo.pas) fill.style.width = '100%';
    else if (i === state.demo.pas) fill.style.width = (t * 100).toFixed(1) + '%';
    else fill.style.width = '0%';
  });
}

function randPasDemo() {
  const stage = el('stage');
  if (!stage) return;
  stage.innerHTML = [sObserv, sAnalizez, sScor, sPrioritizez, sRezultat][state.demo.pas]();
  stage.querySelectorAll('[data-res]').forEach((b) => b.addEventListener('click', () => {
    const card = b.closest('.res');
    card.classList.toggle('open');

}

function sAnalizez() {
  const pts = PRETURI_30Z;
  const w = 100, h = 60;
  const min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
  const d = pts.map((p, i) => (i / (pts.length - 1) * w).toFixed(2) + ',' + (h - (p - min) / (max - min) * h).toFixed(2));
  const linie = 'M' + d.join(' L');

    '<svg class="spark" viewBox="0 0 100 60" preserveAspectRatio="none" aria-label="Evoluția prețului în ultimele 30 de zile">' +
      '<path class="ln" d="' + linie + '" id="sparkLine" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>' +
      '<circle id="sparkDot" cx="100" cy="' + (h - (pts[pts.length - 1] - min) / (max - min) * h).toFixed(2) + '" r="2.2" style="opacity:0"/>' +
    '</svg>' +
    '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:4px">' +

    '<div class="aside-note"><h4>Sursele</h4><p>Recenzii verificate, forumuri, opinii ale specialiștilor, date tehnice, tendințe reale, context propriu.</p></div>');
}

/* --- animații pe pași --- */

function animaPas(id, t) {
  if (id === 'observ') {
    const feed = el('feed');
    if (feed) [...feed.children].forEach((c, i) => c.classList.toggle('in', t > (i + 0.4) / (SEMNALE.length + 1)));
    const cnt = el('cnt');
    if (cnt) cnt.textContent = Math.round(1284 * easeOut(t)).toLocaleString('ro-RO');
  }

  if (id === 'analizez') {
    const tab = el('straturi');
    if (tab) [...tab.children].forEach((r, i) => {
      const prag = (i + 0.3) / (STRATURI.length + 1.4);
      r.classList.toggle('in', t > prag);
      const fill = r.querySelector('.bar > i');
      if (fill) fill.style.width = (t > prag ? STRATURI[i].scor : 0) + '%';
    });
    const ln = el('sparkLine');
    if (ln) ln.style.strokeDashoffset = String(Math.max(0, 1 - t * 1.35));
    const dot = el('sparkDot');
    if (dot) dot.style.opacity = String(t > 0.78 ? 1 : 0);
  }

  if (id === 'scor') {
    const n = Math.round(98 * easeOut(t));
    const box = el('scorMare');
    if (box) box.innerHTML = scorRelevanta(n, 168);
    const c = el('contributii');
    if (c) [...c.children].forEach((r, i) => {
      r.style.opacity = t > (i + 0.5) / (STRATURI.length + 1.2) ? '1' : '0';
    });
  }

  if (id === 'prioritizez') {
    const n = el('noise');
    if (n) [...n.children].forEach((c, i) => {
      if (c.classList.contains('keep')) return;
      c.classList.toggle('gone', t > 0.16 + (i / ZGOMOT.length) * 0.64);
    });
    const to = el('numTo');
    if (to) to.textContent = Math.max(3, Math.round(1284 - 1281 * easeOut(Math.max(0, (t - 0.2) / 0.7)))).toLocaleString('ro-RO');
  }

  if (id === 'rezultat') {
    const r = el('results');
    if (r) [...r.children].forEach((c, i) => setTimeout(() => c.classList.add('in'), i * 170));
  }
}

const easeOut = (t) => 1 - Math.pow(1 - Math.min(Math.max(t, 0), 1), 3);

  v.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => mergiVedere(b.dataset.go)));

  v.querySelectorAll('[data-rapid]').forEach((b) => b.addEventListener('click', () => {

  }));

  v.querySelectorAll('[data-alerta]').forEach((b) => b.addEventListener('click', () => {
    const i = b.dataset.alerta;
    state.alerteDeschise[i] = !state.alerteDeschise[i];
    randVedere();
  }));

  v.querySelectorAll('[data-taba]').forEach((b) => b.addEventListener('click', () => {
    state.tabAlerte = b.dataset.taba;
    randVedere();
  }));

  v.querySelectorAll('[data-interes]').forEach((b) => b.addEventListener('click', () => {
    const [k, i] = b.dataset.interes.split(':');

    it.on = !it.on;
    salveazaGust();
    randVedere();

    // Interesele legate de date schimbă efectiv agenda, nu doar bifa.
    if (it.c) {
      reimprospateazaAgenda().then((rez) => {
        if (!rez) return;
        toast(it.on ? 'VIA urmărește: ' + it.t : 'Oprit: ' + it.t,
          rez.aratate + (rez.aratate === 1 ? ' lucru trece' : ' lucruri trec') + ' pragul acum, din ' + rez.citite + ' verificate.');
      });
      return;
    }

    toast(it.on ? 'VIA urmărește: ' + it.t : 'Oprit: ' + it.t,
      it.on ? 'Primești alerte când apare ceva relevant.' : 'Nu mai primești alerte pe subiectul ăsta.');
  }));

  v.querySelectorAll('[data-fereastra]').forEach((b) => b.addEventListener('click', () => {
    FEREASTRA = b.dataset.fereastra;
    randVedere();
    reimprospateazaAgenda();
  }));

  v.querySelectorAll('[data-salveaza]').forEach((b) => b.addEventListener('click', () => {
    const a = ALERTE[+b.dataset.salveaza];
    if (!a) return;
    const eraSalvat = esteSalvat(a);
    salveazaCard(a);
    randVedere();
    randRail();
    if (eraSalvat) { toast('Scos din salvate', a.t); return; }
    const p = oraPlecarii(a.start);
    toast('Salvat: ' + a.t, 'Pleci ' + fmtScurt.format(p) + ', ca să ajungi la timp.');
  }));

  v.querySelectorAll('[data-calendar]').forEach((b) => b.addEventListener('click', () => {
    const a = ALERTE[+b.dataset.calendar];
    const x = SALVATE.find((s) => s.titlu === (a && a.t));
    if (!x) return;
    const cum = pupCalendar(x);
    toast(cum === 'google' ? 'Se deschide în Google Calendar' : 'Fișier de calendar descărcat',
      cum === 'google' ? x.titlu : 'Deschide-l și intră în calendarul tău, cu amintirea la ora plecării.');
  }));

  v.querySelectorAll('[data-calendar-salvat]').forEach((b) => b.addEventListener('click', () => {
    const x = salvateViitoare()[+b.dataset.calendarSalvat];
    if (!x) return;
    const cum = pupCalendar(x);
    toast(cum === 'google' ? 'Se deschide în Google Calendar' : 'Fișier de calendar descărcat', x.titlu);
  }));

  v.querySelectorAll('[data-sterge-salvat]').forEach((b) => b.addEventListener('click', () => {
    const x = salvateViitoare()[+b.dataset.stergeSalvat];
    if (!x) return;
    salveazaCard({ t: x.titlu });
    randVedere();
    randRail();
    toast('Scos din salvate', x.titlu);
  }));

  v.querySelectorAll('[data-scoate]').forEach((b) => b.addEventListener('click', () => {
    const i = b.dataset.scoate.indexOf(':');
    const fel = b.dataset.scoate.slice(0, i);
    const nume = b.dataset.scoate.slice(i + 1);
    const camp = fel === 'artist' ? 'artisti' : 'locuri';
    GUST[camp] = GUST[camp].filter((x) => x.toLowerCase() !== nume.toLowerCase());
    salveazaGust();
    reimprospateazaAgenda().then(() => {
      randVedere();
      toast('Nu mai urmărești ' + nume, 'Poți să-l pui la loc oricând.');
    });
  }));

  v.querySelectorAll('[data-urmareste]').forEach((b) => b.addEventListener('click', () => {
    const a = ALERTE[+b.dataset.urmareste];
    if (!a || !a.locatie) return;

    const urmarea = urmaresteLocul(a.locatie);
    GUST.locuri = urmarea
      ? GUST.locuri.filter((l) => l.toLowerCase() !== a.locatie.toLowerCase())
      : [...GUST.locuri, a.locatie];
    salveazaGust();

    reimprospateazaAgenda().then((rez) => {
      randVedere();
      if (!rez) return;
      // Câte lucruri de la locul ăsta au intrat în agendă — asta a cerut, asta primește.
      const deAcolo = ALERTE.filter((x) => x.locatie === a.locatie).length;
      toast(
        urmarea ? 'Nu mai urmărești ' + a.locatie : 'Urmărești ' + a.locatie,
        urmarea
          ? 'Nu te mai anunț când apare ceva acolo.'
          : deAcolo > 1
            ? 'Am ' + deAcolo + ' lucruri de acolo în agendă. Te anunț când apare altceva.'
            : 'Te anunț când apare ceva nou acolo.',
      );
    });
  }));

  v.querySelectorAll('[data-nota]').forEach((b) => b.addEventListener('click', () => {
    const [i, verdict] = b.dataset.nota.split(':');
    const a = ALERTE[+i];
    if (!a) return;

    // Scorurile de dinainte, ca să putem spune exact ce a mișcat nota asta.
    const inainte = new Map(ALERTE.map((x) => [x.t, x.scor]));
    noteaza(a, Number(verdict));

    reimprospateazaAgenda().then((rez) => {
      if (!rez) { randVedere(); return; }
      const nota = notaCard(a);

      // Ce a mișcat nota: intrări noi în listă, altele care și-au schimbat scorul,
      // și cele care au căzut sub prag. Asta e învățarea, spusă concret.
      const intrate = ALERTE.filter((x) => x.categorie && !inainte.has(x.t));
      const plecate = [...inainte.keys()].filter((t) => !ALERTE.some((x) => x.t === t));
      const schimbate = ALERTE.filter((x) => x.t !== a.t && inainte.has(x.t) && inainte.get(x.t) !== x.scor).length;

      let detaliu;
      if (intrate.length === 1) detaliu = 'A intrat în listă și „' + intrate[0].t + '".';
      else if (intrate.length > 1) detaliu = 'Au intrat în listă încă ' + intrate.length + ' lucruri.';
      else if (plecate.length === 1) detaliu = 'A ieșit „' + plecate[0] + '", sub prag acum.';
      else if (plecate.length > 1) detaliu = plecate.length + ' lucruri au căzut sub prag.';
      else if (schimbate) detaliu = schimbate + (schimbate === 1 ? ' alt scor s-a schimbat.' : ' alte scoruri s-au schimbat.');
      else detaliu = 'Nu schimbă nimic acum, dar contează la ce urmează.';

      toast(
        nota === 0 ? 'Am șters nota' : nota > 0 ? 'Am reținut că îți place' : 'Am reținut că nu e pentru tine',
        detaliu,
      );
    });
  }));

  v.querySelectorAll('[data-set]').forEach((b) => b.addEventListener('click', () => {
    const camp = b.dataset.set, val = b.dataset.val;
    state.genie[camp] = val;
    randVedere();
    randPanou();
    randRail();
    const ex = camp === 'voce' ? gasesteVoce(val).ex : camp === 'personalitate' ? gasestePers(val).ex : gasesteStil(val).ex;
    Voce.spune(ex, null, undaPornire, undaOprire);
  }));

  v.querySelectorAll('[data-demo]').forEach((b) => b.addEventListener('click', () => {
    const a = b.dataset.demo;
    if (a === 'play') { state.demo.ruleaza ? opreste() : (state.demo.pas === PASI_DEMO.length - 1 ? mergiLa(0) : porneste()); }
    else if (a === 'next') mergiLa(state.demo.pas + 1);
    else if (a === 'prev') mergiLa(state.demo.pas - 1);
    else if (a === 'restart') { state.demo.ruleaza = true; mergiLa(0); }
  }));

  v.querySelectorAll('[data-jump]').forEach((b) => b.addEventListener('click', () => mergiLa(+b.dataset.jump)));

  const g = el('gaugeProg');
  if (g) {
    const C = 2 * Math.PI * 74;
    requestAnimationFrame(() => { g.style.strokeDashoffset = String(C - (SCORE[state.persona].total / 1000) * C); });
  }
}
